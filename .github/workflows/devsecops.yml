name: JuiceShop DevSecOps (Report Mode - Master Branch)

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  SECURITY_ENFORCE: false

jobs:

  # -----------------------------------------
  # PHASE 1: STATIC ANALYSIS
  # -----------------------------------------
  static_analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Gitleaks
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2

      # 🔍 Semgrep (SARIF FIXED)
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/owasp-top-10 \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Debug Semgrep
        run: |
          ls -lah
          head -n 20 semgrep.sarif || echo "no file"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif


      # 🏗️ Checkov (SARIF FIXED)
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d . -o sarif > checkov.sarif || true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif


  # -----------------------------------------
  # PHASE 2: SUPPLY CHAIN
  # -----------------------------------------
  supply_chain:
    needs: static_analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (Cache)
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: NPM Audit
        run: npm audit --audit-level=high || true

      # 🔎 Trivy FS (SARIF FIXED)
      - name: Trivy FS Scan
        run: |
          docker run --rm \
            -v $(pwd):/project \
            aquasec/trivy fs \
            --format sarif \
            --output /project/trivy.sarif \
            /project

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif


  # -----------------------------------------
  # PHASE 3: CONTAINER + DAST
  # -----------------------------------------
  runtime_security:
    needs: supply_chain
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🐳 Build Docker
      - name: Build Image
        run: docker build -t juice-shop:latest .

      # 🛡️ Trivy Image Scan
      - name: Trivy Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image juice-shop:latest || true

      # 🚀 Run App
      - name: Run Container
        run: docker run -d -p 3000:3000 --name app juice-shop:latest

      - name: Wait App
        run: sleep 25

      # 🔐 DAST
      - name: OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false

      # 🧹 Cleanup
      - name: Stop Container
        if: always()
        run: docker rm -f app || true

      # 📊 Summary
      - name: Info
        run: |
          echo "## 🔐 DevSecOps Report Mode" >> $GITHUB_STEP_SUMMARY
          echo "Branch: master" >> $GITHUB_STEP_SUMMARY