name: JuiceShop DevSecOps (Report Mode - Master Branch)

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:

  # -----------------------------------------
  # PHASE 1: STATIC ANALYSIS
  # -----------------------------------------
  static_analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install tools
      - name: Install jq & pipx
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx ensurepath

      # Gitleaks
      - name: Install Gitleaks
        run: |
          # Menggunakan URL release yang stabil agar tidak 404
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks
        run: |
          ./gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            || true

      - name: Validate Gitleaks
        run: cat gitleaks.sarif | jq . > /dev/null

      - name: Upload Gitleaks
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      # Semgrep
      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/owasp-top-10 \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Validate Semgrep
        run: cat semgrep.sarif | jq . > /dev/null

      - name: Upload Semgrep
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # Checkov
      - name: Install Checkov
        run: pipx install checkov

      - name: Run Checkov
        run: |
          checkov -d . \
            --framework dockerfile \
            --quiet \
            -o sarif \
            --output-file-path checkov.sarif \
            || true

      - name: Debug Checkov
        run: |
          ls -lah
          head -n 20 checkov.sarif || echo "no file"

      - name: Upload Checkov
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif


  # -----------------------------------------
  # PHASE 2: SUPPLY CHAIN
  # -----------------------------------------
  supply_chain:
    needs: static_analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install

      - name: NPM Audit
        run: npm audit --audit-level=high || true

      # Trivy FS
      - name: Trivy FS Scan
        run: |
          docker run --rm \
            -v $(pwd):/project \
            aquasec/trivy fs \
            --format sarif \
            --output /project/trivy.sarif \
            /project

      - name: Validate Trivy
        run: cat trivy.sarif | jq . > /dev/null

      - name: Upload Trivy
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif


  # -----------------------------------------
  # PHASE 3: CONTAINER + DAST
  # -----------------------------------------
  runtime_security:
    needs: supply_chain
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build Docker
      - name: Build Image
        run: docker build -t juice-shop:latest .

      # Trivy Image
      - name: Trivy Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image juice-shop:latest || true

      # Run App
      - name: Run Container
        run: docker run -d -p 3000:3000 --name app juice-shop:latest

      - name: Wait App
        run: sleep 25

      # DAST
      - name: OWASP ZAP
        run: |
          docker run --rm \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 || true

      # Cleanup
      - name: Cleanup
        if: always()
        run: docker rm -f app || true

      # Summary
      - name: Summary
        run: |
          echo "## DevSecOps Report Mode" >> $GITHUB_STEP_SUMMARY
          echo "Branch: master" >> $GITHUB_STEP_SUMMARY